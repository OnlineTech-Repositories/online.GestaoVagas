<mat-sidenav-container class="container">
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile() || menuOpen()"
    (closedStart)="menuOpen.set(false)"
    class="sidenav"
  >
    <div class="brand">
      <mat-icon>badge</mat-icon>
      <div>
        <strong>Controle de Vagas</strong>
        <small>Grupo ON LINE</small>
      </div>
    </div>
    <mat-nav-list>
      @for (item of nav(); track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? item.path === '/pedidos' }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isMobile()) {
        <button mat-icon-button aria-label="Abrir menu" (click)="menuOpen.set(!menuOpen())">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      @if (auth.user()?.initialLoadOpen) {
        <span class="load-badge" title="Datas retroativas permitidas sem justificativa">Carga inicial aberta</span>
      }
      <a mat-icon-button routerLink="/notificacoes" aria-label="Notificações">
        <mat-icon [matBadge]="unread() || null" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
      </a>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ auth.user()?.name }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-info">
          <div>{{ auth.user()?.email }}</div>
          <small>{{ roles() }}</small>
        </div>
        <a mat-menu-item routerLink="/trocar-senha">
          <mat-icon>key</mat-icon>
          <span>Trocar senha</span>
        </a>
        <button mat-menu-item (click)="auth.logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
